name: ci

on:
  pull_request:
    branches:
      - main

env:
  DEFAULT_BRANCH: origin/main

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      modules: ${{ steps.get-changed-modules.outputs.modules}}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2

      - name: Get changed terraform modules
        id: get-changed-modules
        run: |
          echo "modules=$(git diff --name-only \
            origin/${{ steps.branch-name.outputs.current_branch }} \
            ${{ env.DEFAULT_BRANCH }} | \
            grep '.tf' | \
            xargs dirname | \
            sort -u | \
            jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  validate-fmt-check:
    needs: [changes]
    if: ${{ needs.changes.outputs.modules != '[]' && needs.changes.outputs.modules != '' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        module: ${{fromJson(needs.changes.outputs.modules)}}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: terraform validate
        uses: dflook/terraform-validate@29a791ea3e8c3a7c0157bb21aba5a6ca59a69d6d # v3.1.0
        with:
          path: "${{ matrix.module }}"

      - name: terraform fmt
        uses: dflook/terraform-fmt-check@e3f43c85d3e0a6bb3adb7be8c423c22c42d572bd # v3.1.0
        with:
          path: "${{ matrix.module }}"
